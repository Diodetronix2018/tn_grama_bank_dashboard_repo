/* ==========================================================================
   TN Grama Bank - Security Operations Dashboard
   Design tokens first, then layout, then components.
   ========================================================================== */

:root {
  --bg: #eef1f7;
  --surface: #ffffff;
  --surface-sunken: #f8f9fb;
  --surface-muted: #f4f6fa;
  --line: #e6e9ef;
  --line-soft: #eceff3;
  --line-faint: #f0f2f5;

  --ink: #0f172a;
  --ink-body: #1c2733;
  --ink-muted: #64748b;
  --ink-soft: #8a94a1;
  --ink-faint: #a3acb8;

  --navy: #002172;
  --navy-deep: #00133f;
  --gold: #d4a94a;
  --green: #15803d;
  --red: #b91c1c;
  --amber: #b45309;

  --dark-1: #0a1128;
  --dark-2: #050814;
  --dark-card: #131c38;

  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 9px;

  --shadow-card: 0 1px 3px rgba(15, 23, 42, .05);
  --shadow-lift: 0 8px 20px rgba(15, 23, 42, .10);
  --shadow-deep: 0 20px 50px rgba(0, 0, 0, .35);

  --font-display: Arial, Helvetica, sans-serif;
  --font-body: Arial, Helvetica, sans-serif;
  --font-mono: Arial, Helvetica, sans-serif;

  --sidebar-w: 264px;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink-body);
  font-family: var(--font-body);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

/* House font is Arial Regular on every screen (sign-in, dashboard, error
   states) -- no bold or italic. !important so form controls, placeholders,
   SVG labels, <b>/<th> defaults and inline styles can't override it. */
*, *::before, *::after, ::placeholder {
  font-family: Arial, Helvetica, sans-serif !important;
  font-weight: 400 !important;
  font-style: normal !important;
}

/* The one exception: important values and numbers are Arial Bold on every
   screen -- screen headings (Dashboard Overview, Branch Monitoring, ...),
   KPI figures, percentages, counts, status badges, codes, phone
   numbers, times, key/value readouts, KPI card labels, and .val (App.dom.val)
   for a number inside running text. Keep in sync with VALUE_SELECTOR in
   tests/selftest.html. */
.topbar h1, .val, .kpi-label, .kpi-value, .pie-pct, .donut-pct, .zone-hero-num, .zone-num,
.muted-count, .chip-count, .rail-count, .map-count, .map-tooltip b,
.badge, .overall-pill, .time-pill, .clock-time, .mono,
.event-line-time, .feed-time-dark, table.data tbody td.num,
.kv-row span:last-child, .ss-kv span:last-child, .ss-value, .ss-strong,
.ss-scale-label, .ss-yes, .ss-no {
  font-weight: 700 !important;
}

a { color: var(--navy); }
a:hover { color: #00154f; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #cbd4e0; border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

/* ---------- Layout ------------------------------------------------------ */

.shell { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  background: linear-gradient(180deg, var(--navy-deep), #000a26);
  padding: 22px 14px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 2px 6px 18px;
  border-bottom: 1px solid rgba(255, 255, 255, .09);
  margin-bottom: 14px;
}

/* White disc behind the bank's gear-and-map logo; the logo carries its
   own gear ring, so the disc adds no border of its own. */
.brand-mark {
  width: 58px;
  height: 58px;
  flex: 0 0 58px;
  border-radius: 50%;
  background: #fff;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
}

.brand-mark img {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 50%;
  object-fit: contain;
}

.brand-name {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 800;
  color: #fff;
  line-height: 1.2;
  letter-spacing: .02em;
  white-space: nowrap;
}

.brand-sub {
  font-size: 9.5px;
  color: #8fa0c9;
  font-weight: 600;
  letter-spacing: .05em;
  line-height: 1.45;
  margin-top: 3px;
  white-space: nowrap;
}

.brand-sub-accent { color: var(--gold); }

.nav-heading {
  font-family: var(--font-display);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .09em;
  color: #5a6f9c;
  padding: 8px 10px 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 600;
  color: #a7b6d6;
  background: transparent;
  border: 0;
  width: 100%;
  text-align: left;
  font-family: inherit;
  transition: background .15s ease, color .15s ease;
}

.nav-item:hover { background: rgba(255, 255, 255, .07); color: #d7e0f2; }

.nav-item.is-active { background: rgba(255, 255, 255, .08); color: #fff; }

.nav-chip {
  width: 27px;
  height: 27px;
  flex: 0 0 27px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #5f7ab0;
  background: rgba(255, 255, 255, .06);
}

.nav-item.is-active .nav-chip { background: var(--gold); color: #0a1f4d; }

.nav-label { flex: 1; }

.nav-dot {
  width: 5px;
  height: 5px;
  flex: 0 0 5px;
  border-radius: 50%;
  background: var(--gold);
}

.sidebar-note {
  margin-top: auto;
  padding: 14px 10px 4px;
  border-top: 1px solid rgba(255, 255, 255, .09);
  font-size: 9.5px;
  color: #5a6f9c;
  line-height: 1.65;
}

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 20px 32px;
  border-bottom: 1px solid #e2e6ec;
  background: rgba(255, 255, 255, .92);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 5;
}

.topbar h1 {
  font-family: var(--font-display);
  font-size: 21px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -.01em;
  margin: 0;
}

.topbar-sub { font-size: 12.5px; color: var(--ink-muted); margin-top: 3px; }

.topbar-right { display: flex; align-items: center; gap: 18px; }

.clock {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--ink-muted);
  font-family: var(--font-mono);
  background: var(--surface-muted);
  border: 1px solid #e2e6ec;
  border-radius: 20px;
  padding: 6px 14px;
}

.freshness {
  font-size: 12px;
  color: var(--ink-muted);
  background: var(--surface-muted);
  border: 1px solid #e2e6ec;
  border-radius: 20px;
  padding: 6px 14px;
}

.freshness:empty { display: none; }

.idle-note {
  font-size: 12px;
  color: var(--amber);
  background: #fdf3e4;
  border: 1px solid #f0dcb3;
  border-radius: 20px;
  padding: 6px 14px;
}

.idle-note:empty { display: none; }

.freshness.is-stale {
  color: var(--amber);
  border-color: #f0dcb3;
  background: #fdf3e4;
}

.clock-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 1.4s infinite;
}

.overall-pill {
  padding: 7px 16px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .03em;
  border: 1px solid transparent;
  white-space: nowrap;
}

.content { padding: 28px 32px 60px; flex: 1; min-width: 0; max-width: 1400px; }

/* ---------- Primitives -------------------------------------------------- */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}

.card-pad { padding: 22px; }

.card-head {
  padding: 18px 22px;
  border-bottom: 1px solid var(--line-soft);
  background: linear-gradient(135deg, #f8f9fc, #ffffff);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}

.card-title {
  font-family: var(--font-display);
  font-size: 14.5px;
  font-weight: 700;
  color: var(--ink);
}

.card-title .muted-count { color: var(--ink-faint); font-weight: 500; }

.card-sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }

.section-label {
  font-size: 11px;
  color: var(--ink-soft);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .03em;
  margin-bottom: 12px;
}

.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  border: 1px solid transparent;
  white-space: nowrap;
}

.badge.sm { font-size: 10px; padding: 2px 8px; }

.icon-chip {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
}

.icon-chip.sm { width: 32px; height: 32px; flex-basis: 32px; border-radius: 9px; }
.icon-chip.lg { width: 40px; height: 40px; flex-basis: 40px; border-radius: 11px; }
.kpi-sep { color: var(--ink-soft); }

.text-input {
  width: 100%;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid #e2e6ec;
  font-size: 12.5px;
  font-family: var(--font-body);
  outline: none;
  color: var(--ink-body);
  background: var(--surface-sunken);
}

.text-input:focus { border-color: var(--navy); background: #fff; }
.text-input::placeholder { color: var(--ink-faint); }

.close-btn {
  cursor: pointer;
  font-size: 12px;
  color: var(--ink-muted);
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 8px;
  background: var(--surface-muted);
  border: 0;
  font-family: inherit;
}

.close-btn:hover { background: #e8ecf3; }

.btn-primary {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 15px;
  border-radius: 10px;
  border: 1px solid var(--navy);
  background: var(--navy);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  font-family: var(--font-body);
  cursor: pointer;
}

.btn-primary:hover { background: #00154f; }

/* Segmented control used for every view-mode switch. */
.segmented { display: flex; background: var(--line-faint); border-radius: 10px; padding: 3px; gap: 2px; }

.segmented button {
  border: 0;
  background: transparent;
  padding: 7px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: var(--font-body);
  color: var(--ink-soft);
}

.segmented button.is-active {
  background: #fff;
  box-shadow: 0 1px 2px rgba(15, 23, 42, .12);
  color: var(--navy);
}

/* ---------- Grids ------------------------------------------------------- */

.grid { display: grid; gap: 16px; }
.grid.align-start { align-items: start; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.gap-sm { gap: 14px; }
.mb-lg { margin-bottom: 18px; }
.mt-lg { margin-top: 18px; }
.mt-md { margin-top: 16px; }

/* ---------- KPI cards --------------------------------------------------- */

.kpi {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 18px 18px 16px;
  box-shadow: var(--shadow-card);
  position: relative;
  overflow: hidden;
  text-align: left;
  width: 100%;
  transition: transform .15s ease, box-shadow .15s ease;
}

.kpi.is-clickable { cursor: pointer; }
.kpi.is-clickable:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.kpi.is-selected { border-color: var(--navy); box-shadow: 0 0 0 1px var(--navy), var(--shadow-lift); }

.kpi-rail { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
/* KPI icons sit on a soft tint of the card colour, with no outline. */
.kpi .icon-chip { border-color: transparent !important; }

.kpi-label {
  font-size: 11.5px;
  color: var(--ink-body);
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  margin-top: 14px;
}

.kpi-value {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
  color: var(--ink);
  margin-top: 4px;
  letter-spacing: -.01em;
}

.kpi-value.sm { font-size: 24px; }
.kpi-hint { font-size: 10.5px; color: var(--ink-faint); margin-top: 3px; }
.kpi.compact { padding: 16px 18px; }
.kpi.compact .kpi-label { margin-top: 12px; }

/* ---------- Tables ------------------------------------------------------ */

.table-scroll { overflow-y: auto; overflow-x: auto; }

table.data {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

table.data thead tr { background: var(--surface-sunken); }

table.data thead th {
  position: sticky;
  top: 0;
  background: var(--surface-sunken);
  text-align: left;
  padding: 10px 12px;
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-soft);
  text-transform: uppercase;
  letter-spacing: .03em;
  white-space: nowrap;
  z-index: 1;
}

table.data thead th.num { text-align: right; }
table.data thead th.mid { text-align: center; }

table.data tbody td { padding: 10px 12px; border-top: 1px solid var(--line-faint); }
table.data tbody td.num { text-align: right; font-family: var(--font-mono); }
table.data tbody td.mid { text-align: center; }
table.data tbody td.mono { font-family: var(--font-mono); color: var(--ink-muted); }
table.data tbody td.name { font-weight: 700; color: var(--ink-body); white-space: nowrap; }
table.data tbody td.sub { color: var(--ink-muted); white-space: nowrap; }
table.data thead th:first-child, table.data tbody td:first-child { padding-left: 22px; }
table.data thead th:last-child, table.data tbody td:last-child { padding-right: 22px; }
table.data tbody tr.is-clickable { cursor: pointer; }
table.data tbody tr.is-clickable:hover { background: #f6f8fd; }

/* ---------- Overview ---------------------------------------------------- */

.pies { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

.pie {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 12px;
  padding: 14px 14px 12px;
  background: var(--surface-sunken);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-md);
}

.pie-head { display: flex; align-items: center; gap: 8px; }

.pie-icon {
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.pie-title { font-size: 12.5px; color: var(--ink); font-weight: 700; }

.pie-chart { position: relative; align-self: center; width: 112px; height: 112px; }
.pie-chart svg { transform: rotate(-90deg); display: block; }

.pie-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.pie-pct {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
}

.pie-center-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-soft);
  text-transform: uppercase;
  letter-spacing: .05em;
  margin-top: 3px;
}

.pie-rows { display: flex; flex-direction: column; gap: 6px; }

.pie-row {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  padding: 6px 8px;
  background: var(--surface, #fff);
  border-radius: 8px;
}

.pie-swatch { width: 10px; height: 10px; flex: 0 0 10px; border-radius: 3px; }
.pie-row-label { flex: 1; color: var(--ink-muted); font-weight: 600; }
.pie-row-count { color: var(--ink); font-size: 13px; }
.pie-row-pct { color: var(--ink-soft); font-size: 11px; font-weight: 600; min-width: 30px; text-align: right; }

.pie-foot { font-size: 10.5px; color: var(--ink-soft); text-align: center; }

.state-mix {
  margin-top: 14px;
  padding: 12px 14px;
  background: var(--surface-sunken);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-md);
}

.state-mix-title { font-size: 12.5px; font-weight: 700; color: var(--ink); }
.state-mix-total { font-size: 11px; color: var(--ink-soft); }

.state-bar {
  display: flex;
  gap: 2px;
  height: 12px;
  margin: 10px 0;
  border-radius: 6px;
  overflow: hidden;
}

.state-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; }

.state-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--ink-muted);
  font-weight: 600;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: var(--ink-muted);
  font-weight: 600;
}

.dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; }
.dot.md { width: 8px; height: 8px; flex-basis: 8px; }
.dot.lg { width: 11px; height: 11px; flex-basis: 11px; }

.list-scroll { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }

.row-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  background: transparent;
  border: 1px solid transparent;
  text-align: left;
  font-family: inherit;
  width: 100%;
}

.row-item:hover { background: #f6f8fd; }
.row-item.is-selected { background: #eef1fb; border-color: var(--navy); }
.row-item-name { font-size: 12.5px; font-weight: 600; color: var(--ink-body); }
.row-item-sub { font-size: 10.5px; color: var(--ink-soft); }
.row-item.tight { padding: 8px 10px; }
.row-item.tight .row-item-name { font-size: 12px; }

.spotlight-grid { display: grid; grid-template-columns: 1.4fr 1fr; align-items: start; }
.spotlight-left { padding: 20px 22px; border-right: 1px solid var(--line-soft); }
.spotlight-right { padding: 20px 22px; }

.event-line {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface-sunken);
  border-radius: 10px;
  padding: 11px 13px;
}

.event-line-type { font-size: 12.5px; font-weight: 700; color: var(--ink-body); }
.event-line-zone { font-size: 11px; color: var(--ink-muted); margin-top: 1px; }
.event-line-time { font-size: 11px; color: var(--ink-soft); font-family: var(--font-mono); }

.kv-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 12px;
  padding: 10px 12px;
  background: var(--surface-sunken);
  border-radius: var(--radius-sm);
}

.kv-row span:first-child { color: var(--ink-muted); }
.kv-row span:last-child { color: var(--ink-body); font-weight: 600; text-align: right; word-break: break-word; }

/* ---------- Branch cards ------------------------------------------------ */

.branch-grid {
  padding: 16px 18px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
  overflow-y: auto;
}

.branch-card {
  background: var(--surface-sunken);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease;
  text-align: left;
  font-family: inherit;
}

.branch-card:hover { background: #eef1fb; border-color: var(--navy); }
.branch-card-name {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink-body);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.branch-card-district { font-size: 11px; color: var(--ink-soft); margin-top: 1px; }

/* ---------- Chips ------------------------------------------------------- */

.chip-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }

.chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 11px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 11.5px;
  font-weight: 700;
  white-space: nowrap;
  background: var(--surface-sunken);
  border: 1px solid var(--line-soft);
  color: var(--ink-muted);
  font-family: inherit;
}

.chip:hover { border-color: #cfd6e2; }
.chip-count { opacity: .6; }

.chip.dark {
  background: rgba(255, 255, 255, .06);
  border-color: rgba(255, 255, 255, .1);
  color: rgba(255, 255, 255, .7);
}

/* ---------- Live activities -------------------------------------------- */

.latest-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 16px;
}

.latest-eyebrow {
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-faint);
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-bottom: 5px;
}

.latest-branch { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--ink); }
.latest-meta { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }

.feed { max-height: 600px; overflow-y: auto; padding-right: 2px; }

.feed-row {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  margin-bottom: 8px;
  box-shadow: 0 1px 3px rgba(15, 23, 42, .04);
}

.feed-branch { font-size: 13px; font-weight: 700; color: var(--ink-body); }
.feed-meta {
  font-size: 11.5px;
  color: var(--ink-soft);
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.time-pill {
  font-size: 11px;
  font-family: var(--font-mono);
  font-weight: 700;
  border-radius: 8px;
  padding: 5px 10px;
  white-space: nowrap;
}

.command-panel {
  background: linear-gradient(160deg, var(--dark-1), var(--dark-2));
  border-radius: 24px;
  padding: 28px 30px;
  box-shadow: var(--shadow-deep);
}

.command-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.command-title { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: #fff; }
.command-sub { font-size: 12.5px; color: rgba(255, 255, 255, .5); margin-top: 4px; }
.command-chips { display: flex; flex-wrap: wrap; gap: 6px; max-width: 640px; justify-content: flex-end; }

.feed-row.dark {
  background: linear-gradient(160deg, var(--dark-card), var(--dark-1));
  border-radius: 14px;
  box-shadow: 0 2px 10px rgba(0, 0, 0, .3);
}

.feed-row.dark .feed-branch { color: #fff; line-height: 1.3; }
.feed-row.dark .feed-meta { color: rgba(255, 255, 255, .45); }

.feed-time-dark {
  font-size: 11px;
  color: rgba(255, 255, 255, .65);
  font-family: var(--font-mono);
  flex: 0 0 auto;
  width: 92px;
  text-align: right;
}

/* ---------- Zone status ------------------------------------------------- */

.zone-hero {
  background: linear-gradient(135deg, #001a5c, #0a3fb8);
  border-radius: 20px;
  padding: 32px 36px;
  color: #fff;
  box-shadow: 0 12px 32px rgba(0, 33, 114, .25);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}

.zone-hero-name { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.zone-hero-sub { font-size: 13px; color: rgba(255, 255, 255, .7); margin-top: 4px; }
.zone-hero-stats { display: flex; gap: 28px; }
.zone-hero-stat { text-align: center; }
.zone-hero-num { font-family: var(--font-display); font-size: 32px; font-weight: 700; }
.zone-hero-cap {
  font-size: 10.5px;
  color: rgba(255, 255, 255, .65);
  text-transform: uppercase;
  letter-spacing: .05em;
  margin-top: 2px;
}

.zone-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 18px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(15, 23, 42, .06);
  transition: transform .15s ease;
}

.zone-card:hover { transform: translateY(-3px); }
.zone-card-bar { position: absolute; left: 0; top: 0; right: 0; height: 4px; }
.zone-card-name {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--ink);
  margin-top: 14px;
  line-height: 1.3;
  min-height: 34px;
}
.zone-num {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-faint);
  letter-spacing: .04em;
}
.zone-card-foot {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--line-faint);
  font-size: 11px;
  color: var(--ink-soft);
  font-family: var(--font-mono);
}

.showcase {
  background: linear-gradient(160deg, var(--dark-1), var(--dark-2));
  border-radius: 24px;
  padding: 32px;
  box-shadow: var(--shadow-deep);
}

.showcase-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
  flex-wrap: wrap;
  margin-bottom: 28px;
}

.showcase-name { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: #fff; letter-spacing: -.01em; }
.showcase-sub { font-size: 13px; color: rgba(255, 255, 255, .5); margin-top: 4px; }

.donut {
  width: 104px;
  height: 104px;
  flex: 0 0 104px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.donut-core {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--dark-1);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.donut-pct { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: #fff; }
.donut-cap { font-size: 9px; color: rgba(255, 255, 255, .5); letter-spacing: .04em; }

.showcase-legend { display: flex; flex-direction: column; gap: 7px; }
.showcase-legend div { display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(255, 255, 255, .65); }

.zone-card.dark {
  background: linear-gradient(160deg, var(--dark-card), var(--dark-1));
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
}

.zone-card.dark:hover { transform: none; }
.zone-card.dark .zone-card-name { color: #fff; font-size: 14px; margin-top: 16px; min-height: 36px; position: relative; z-index: 1; }
.zone-card.dark .zone-card-foot { border-top-color: rgba(255, 255, 255, .08); color: rgba(255, 255, 255, .4); position: relative; z-index: 1; }

.zone-watermark {
  position: absolute;
  top: 2px;
  right: 14px;
  font-family: var(--font-display);
  font-size: 50px;
  font-weight: 700;
  color: rgba(255, 255, 255, .055);
  line-height: 1;
}
/* A word ("TAMPER") in place of a zone number, sized down to fit the card. */
.zone-watermark.word { font-size: 34px; top: 10px; letter-spacing: .02em; }

.district-rail { border-right: 1px solid var(--line-soft); padding: 10px; max-height: 440px; overflow-y: auto; }

.rail-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 9px 12px;
  border-radius: 8px;
  cursor: pointer;
  background: transparent;
  border: 0;
  border-left: 3px solid transparent;
  width: 100%;
  font-family: inherit;
}

.rail-row:hover { background: #f6f8fd; }
.rail-row.is-selected { background: #eef1fb; border-left-color: var(--navy); }
.rail-row span:first-child { font-size: 12.5px; font-weight: 600; color: var(--ink-body); }
.rail-row.is-selected span:first-child { font-weight: 700; color: var(--navy); }
.rail-count { font-size: 10.5px; color: var(--ink-faint); font-family: var(--font-mono); }

.picker-grid {
  padding: 14px 16px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px;
  max-height: 440px;
  overflow-y: auto;
  align-content: start;
}

.picker-tile {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  background: var(--surface-sunken);
  border: 1px solid var(--line-soft);
  text-align: left;
  font-family: inherit;
}

.picker-tile:hover { border-color: var(--navy); }
.picker-tile.is-selected { background: #eef1fb; border-color: var(--navy); }
.picker-tile span:first-child { font-size: 12px; font-weight: 600; color: var(--ink-body); }

.picker-compact {
  padding: 14px 16px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 6px;
  max-height: 480px;
  overflow-y: auto;
}

.picker-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  background: var(--surface-sunken);
  border: 1px solid var(--line-soft);
  border-radius: 7px;
  padding: 7px 10px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-body);
  line-height: 1.3;
}

.picker-chip:hover { border-color: var(--navy); }
.picker-chip.is-selected { background: #eef1fb; border-color: var(--navy); }

/* ---------- Maps -------------------------------------------------------- */

.map-wrap {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  height: 864px;
  box-shadow: var(--shadow-card);
  position: relative;
}

.map-svg { width: 100%; height: 100%; display: block; background: linear-gradient(180deg, #f7f9fd, #eef2f9); }
.map-pin { cursor: pointer; }
.map-pin:hover circle { stroke: var(--navy); stroke-width: 2; }

.map-tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(10, 17, 40, .95);
  color: #fff;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 11.5px;
  line-height: 1.55;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
  white-space: nowrap;
  transform: translate(-50%, calc(-100% - 14px));
  opacity: 0;
  transition: opacity .12s ease;
  z-index: 4;
}

.map-tooltip.is-visible { opacity: 1; }
.map-tooltip b { font-size: 12.5px; }

/* ---------- Settings ---------------------------------------------------- */
/* Built from the shared primitives (.card, .card-head, .segmented,
   .text-input, .report-rail); only what they don't cover lives here. */

.ss-layout {
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}

.ss-rail { position: sticky; top: 16px; }

.ss-panel, .ss-stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.ss-header {
  padding: 18px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.ss-save-note { font-size: 11.5px; color: var(--ink-faint); }
.ss-save-note.is-ok { color: var(--green); }
.ss-save-note.is-warn { color: var(--amber); }

.ss-body { padding: 4px 22px 8px; }

/* Label column + control column, so a control sits next to what it
   describes instead of across a 1000px-wide card. */
.ss-row {
  display: grid;
  grid-template-columns: minmax(0, 300px) minmax(0, 1fr);
  align-items: center;
  gap: 8px 24px;
  padding: 14px 0;
  border-top: 1px solid var(--line-faint);
}

.ss-body > .ss-row:first-child,
.ss-body > .ss-list-row:first-child { border-top: 0; }

.ss-rl { font-size: 12.5px; color: var(--ink-body); }
.ss-rd { font-size: 11px; color: var(--ink-soft); margin-top: 3px; line-height: 1.45; }
.ss-row-control { min-width: 0; display: flex; align-items: center; }

.ss-value { font-size: 12.5px; color: var(--ink-body); }
.ss-value.is-ok, .ss-value.is-warn, .ss-value.is-muted { display: inline-flex; align-items: center; gap: 7px; }
.ss-value.is-ok::before, .ss-value.is-warn::before, .ss-value.is-muted::before {
  content: "";
  width: 7px;
  height: 7px;
  flex: 0 0 7px;
  border-radius: 50%;
  background: currentColor;
}
.ss-value.is-ok { color: var(--green); }
.ss-value.is-warn { color: var(--amber); }
.ss-value.is-muted { color: var(--ink-soft); }

.ss-tag {
  display: inline-block;
  font-size: 10px;
  color: var(--ink-soft);
  background: var(--surface-muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 8px;
  white-space: nowrap;
}

.ss-segmented { display: inline-flex; }
.ss-select.text-input { width: auto; min-width: 220px; padding: 8px 12px; cursor: pointer; }
.segmented button:disabled { cursor: not-allowed; color: var(--ink-faint); opacity: .7; }

.ss-toggle {
  display: inline-flex;
  align-items: center;
  width: 34px;
  height: 19px;
  border-radius: 10px;
  padding: 2px;
  border: 0;
  cursor: pointer;
  background: #d8dde5;
  transition: background .15s ease;
}
.ss-toggle i {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
  transition: transform .15s ease;
}
.ss-toggle.on { background: var(--navy); }
.ss-toggle.on i { transform: translateX(15px); }

.ss-range { display: flex; align-items: center; gap: 12px; }
.ss-range input[type="range"] { width: 160px; accent-color: var(--navy); }
.ss-scale-label { font-size: 12px; color: var(--navy); min-width: 38px; }

button:focus-visible, a:focus-visible, .text-input:focus-visible, input[type="range"]:focus-visible {
  outline: 2px solid var(--navy);
  outline-offset: 2px;
}

/* Theme cards */
.ss-themes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 12px 0 10px; }
.ss-theme {
  padding: 10px;
  border-radius: var(--radius-md);
  border: 2px solid var(--line);
  background: var(--surface);
  font-family: inherit;
  color: var(--ink-body);
  text-align: left;
  cursor: default;
}
.ss-theme.on { border-color: var(--navy); }
.ss-theme:disabled { cursor: not-allowed; }
.ss-theme:disabled .ss-preview { opacity: .55; }
.ss-preview { height: 78px; border-radius: var(--radius-sm); overflow: hidden; display: flex; border: 1px solid var(--line); }
.ss-preview-side { width: 26%; }
.ss-preview-main { flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.ss-preview-bar { height: 8px; width: 60%; border-radius: 4px; }
.ss-preview-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; flex: 1; }
.ss-preview-cards div { border-radius: 5px; }
.ss-theme-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 12.5px; }
.ss-dot { width: 14px; height: 14px; border-radius: 50%; border: 4px solid var(--navy); }

.ss-accents { display: flex; gap: 14px; flex-wrap: wrap; padding: 12px 0 10px; }
.ss-accent {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
  color: var(--ink-muted);
  background: none;
  border: 0;
  padding: 4px;
}
.ss-accent b { display: block; width: 38px; height: 38px; border-radius: var(--radius-md); }
.ss-accent.on { color: var(--ink-body); }
.ss-accent.on b { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px currentColor; }

.ss-btn-quiet {
  font-family: inherit;
  font-size: 11.5px;
  color: var(--ink-muted);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 7px 12px;
  cursor: pointer;
}
.ss-btn-quiet:hover:not(:disabled) { color: var(--navy); border-color: var(--navy); }
.ss-btn-quiet:disabled { cursor: default; color: var(--ink-faint); }

/* Roles table */
.ss-yes { color: var(--green); }
.ss-no { color: var(--ink-faint); }

/* Support */
.ss-auto-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.ss-support-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }

.ss-contact { padding: 18px 22px; }
.ss-contact-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.ss-contact .card-sub { margin-bottom: 10px; }

.ss-kv {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px;
  background: var(--surface-sunken);
  border-radius: 10px;
  font-size: 12px;
  margin-top: 8px;
  text-decoration: none;
  color: var(--ink-body);
}
.ss-kv:hover { background: var(--surface-muted); }
.ss-kv span:first-child { color: var(--ink-soft); }
.ss-kv span:last-child { color: var(--navy); text-align: right; overflow-wrap: anywhere; min-width: 0; }

.ss-list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-top: 1px solid var(--line-faint);
  font-size: 12px;
  color: var(--ink-body);
  text-decoration: none;
}
.ss-list-row.is-link:hover span:first-child { color: var(--navy); text-decoration: underline; }
.ss-list-row > span:first-child { flex: 0 0 auto; }
.ss-list-row .ss-value { font-size: 12px; text-align: right; }
.ss-strong { color: var(--ink-body); text-align: right; }
.ss-soft { color: var(--ink-soft); }
.ss-faint { color: var(--ink-faint); }

.ss-form { display: flex; flex-direction: column; gap: 14px; padding: 12px 0 14px; }
.ss-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ss-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ss-field > span { font-size: 10.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .03em; }
.ss-field .text-input { padding: 9px 12px; }
.ss-field textarea.text-input { resize: vertical; min-height: 92px; }
.text-input.is-invalid { border-color: var(--red); }
.ss-error { font-size: 11px; color: var(--red); }
.ss-hint { font-size: 11px; color: var(--green); }

.ss-callout {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: #fdeeee;
  border: 1px solid #f3c9c9;
  color: var(--red);
  font-size: 12px;
  line-height: 1.45;
}
.ss-callout-icon { display: flex; flex: 0 0 19px; width: 19px; height: 19px; margin-top: 1px; }
.ss-callout-icon svg { width: 19px; height: 19px; }

.ss-actions { display: flex; justify-content: flex-end; }

.ss-btn {
  background: var(--navy);
  color: #fff;
  font-family: inherit;
  font-size: 12.5px;
  padding: 10px 18px;
  border-radius: 10px;
  border: 0;
  cursor: pointer;
}

.ss-success {
  margin: 12px 0 14px;
  padding: 18px 20px;
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.ss-success-title { font-size: 13px; color: var(--green); }
.ss-success p { margin: 0; font-size: 12px; color: #166534; line-height: 1.5; }

.ss-link {
  align-self: flex-start;
  font-family: inherit;
  font-size: 12px;
  color: var(--navy);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  margin-top: 6px;
  text-decoration: underline;
}

@media (max-width: 1180px) {
  .ss-support-grid { grid-template-columns: minmax(0, 1fr); }
}

@media (max-width: 900px) {
  .ss-layout { grid-template-columns: minmax(0, 1fr); }
  .report-rail.ss-rail { position: static; flex-direction: row; overflow-x: auto; max-height: none; }
  .ss-rail .report-item { width: auto; flex: 0 0 auto; }
  .ss-rail .report-item-desc { display: none; }
  .ss-row { grid-template-columns: minmax(0, 1fr); }
  .ss-themes, .ss-grid2 { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- Display preferences (src/core/prefs.js) --------------------- */

.content { zoom: var(--ui-scale, 1); }

.pref-compact table.data tbody td { padding-top: 6px; padding-bottom: 6px; }

.pref-reduce-motion *, .pref-reduce-motion *::before, .pref-reduce-motion *::after {
  animation: none !important;
  transition: none !important;
}

.pref-sidebar-collapsed { --sidebar-w: 76px; }
.pref-sidebar-collapsed .brand { justify-content: center; padding-left: 0; padding-right: 0; }
.pref-sidebar-collapsed .brand-mark { width: 48px; height: 48px; flex-basis: 48px; }
.pref-sidebar-collapsed .brand > div,
.pref-sidebar-collapsed .nav-heading,
.pref-sidebar-collapsed .nav-label,
.pref-sidebar-collapsed .nav-dot,
.pref-sidebar-collapsed .sidebar-note { display: none; }
.pref-sidebar-collapsed .nav-item { justify-content: center; }

/* ---------- Reports ----------------------------------------------------- */

.report-rail {
  background: var(--surface);
  align-self: start;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 10px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: 3px;
  max-height: 640px;
  overflow-y: auto;
}

.report-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 11px;
  border-radius: 11px;
  cursor: pointer;
  background: transparent;
  border: 0;
  text-align: left;
  font-family: inherit;
  color: var(--ink-muted);
  width: 100%;
}

.report-item:hover { background: #f4f6fa; }
.report-item.is-active { background: #eef1fb; color: var(--navy); }
.report-item-label { font-size: 12.5px; font-weight: 700; }
.report-item-desc {
  font-size: 10.5px;
  opacity: .75;
  margin-top: 1px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.report-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; color: var(--ink); }
.report-desc { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.report-stamp { font-size: 11px; color: var(--ink-faint); font-family: var(--font-mono); }

/* ---------- Empty state ------------------------------------------------- */

.empty {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 70px 30px;
  text-align: center;
  box-shadow: var(--shadow-card);
}

.empty-mark {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: var(--surface-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 18px;
  color: var(--ink-faint);
}

/* ---------- Utilities --------------------------------------------------- */

.flex { display: flex; }
.flex-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.flex-center { display: flex; align-items: center; gap: 10px; }
.flex-col { display: flex; flex-direction: column; }
.flex-wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.gap-6 { gap: 6px; }
.gap-8 { gap: 8px; }
.gap-10 { gap: 10px; }
.gap-12 { gap: 12px; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--ink-muted); }
.soft { color: var(--ink-soft); }
.nowrap { white-space: nowrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hidden { display: none !important; }

@media (max-width: 1180px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .spotlight-grid { grid-template-columns: 1fr; }
  .spotlight-left { border-right: 0; border-bottom: 1px solid var(--line-soft); }
}

@media (max-width: 900px) {
  .sidebar { display: none; }
  .content { padding: 20px 16px 48px; }
  .topbar { padding: 16px; flex-wrap: wrap; }
  .topbar-right { flex-wrap: wrap; gap: 10px; }
  .grid-2, .grid-3, .grid-4, .grid-5 { grid-template-columns: minmax(0, 1fr); }
  /* Two-pane layouts set their columns inline; stack them on phones. */
  .grid.split { grid-template-columns: minmax(0, 1fr) !important; }
  .map-wrap { height: 70vh; }
}

/* ---- Boot states: shown while liveSource.js is fetching branch data ---- */
.boot-state {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
}

.boot-card {
  max-width: 380px;
  text-align: center;
  padding: 32px;
}

.boot-spinner {
  width: 32px;
  height: 32px;
  margin: 0 auto 18px;
  border-radius: 50%;
  border: 3px solid var(--line);
  border-top-color: var(--navy);
  animation: boot-spin 0.8s linear infinite;
}

@keyframes boot-spin {
  to { transform: rotate(360deg); }
}

.boot-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  color: var(--ink);
  margin-bottom: 6px;
}

.boot-detail {
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--ink-muted);
  line-height: 1.5;
}

.boot-card .boot-title.is-error { color: var(--red); }

.boot-retry {
  margin-top: 16px;
  border: 1px solid var(--navy);
  background: var(--navy);
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  cursor: pointer;
}

.boot-retry:hover { background: var(--navy-deep); }

/* ---- Login / new-password screens (reuse .boot-card/.boot-state above) ---- */
.login-card { max-width: 320px; }

.login-field {
  text-align: left;
  margin-top: 14px;
}

.login-field label {
  display: block;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-muted);
  margin-bottom: 5px;
}

.login-error {
  min-height: 16px;
  margin-top: 12px;
  font-size: 12px;
  color: var(--red);
}

.login-card .boot-retry { width: 100%; }

.forgot-password-link {
  display: block;
  width: 100%;
  margin-top: 12px;
  border: none;
  background: none;
  color: var(--navy);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
}

.forgot-password-link:hover { text-decoration: underline; }

/* ---- Topbar sign-out chip ---- */
.user-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--ink-muted);
}

.sign-out-btn {
  border: 1px solid #e2e6ec;
  background: var(--surface-muted);
  color: var(--ink-body);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 20px;
  cursor: pointer;
}

.sign-out-btn:hover { border-color: var(--navy); color: var(--navy); }

</style>

/* Fetches branch records from the backend API instead of generating sample

     deployment serving both from one origin -- see backend/app/main.py's
     serve_dashboard_static), a relative path targets whatever origin this
     page was actually loaded from. */

      counts[b.district] = (counts[b.district] || 0) + 1;

      r.branchCount = counts[r.name] || 0;

    return fetch(CONFIG.apiBaseUrl + "/api/branches", {
      credentials: "include",

      .then(function (res) {

     App.onSessionExpired) from any other failure (App.reportRefresh's

      function () {
        inFlight = false;
        if (App.reportRefresh) App.reportRefresh(true);
      },
      function (err) {

/* Talks to the backend's /api/auth/* endpoints. Kept separate from
   liveSource.js the same way master.js/derived.js/liveSource.js are each
   scoped to one concern. Every call sends credentials:"include" so the

    return fetch(apiBaseUrl() + path, {
      method: "POST",

    }).then(function (res) {
      // A proxy error page or an empty 204 isn't JSON; keep the HTTP status
      // instead of surfacing "Unexpected token '<'" in the login box.

        var data = null;

/* ==== src/views/intrusionStatus.js ==== */
/* Intrusion Status: current arm/alarm/fault/tamper state. Every counter
   opens the list behind it. */
(function (App) {
  "use strict";

  var h = App.dom.h;
  var W = App.widgets;
  var u = App.utils;
  var COLORS = u.COLORS;

  var LIVE_FILTERS = {
    armed: { title: "Armed Branches", match: function (b) { return b.panelStatus === "Armed"; } },
    disarmed: { title: "Disarmed Branches", match: function (b) { return b.panelStatus === "Disarmed"; } },
    alarm: { title: "Alarm Active Branches", match: function (b) { return b.panelStatus === "Alarm Active"; } },
    fault: { title: "Fault Active Branches", match: function (b) { return b.panelStatus === "Fault"; } },
  };

  function openBranch(ctx, branch) {
    ctx.setState({ selectedRegion: branch.district, selectedBranchId: branch.id });
    ctx.go("overview");
  }

  function livePanel(ctx) {
    var key = ctx.state.liveStatusFilter;
    if (!key) return null;

    if (key === "tamper") {
      var tampered = App.data.tamperBranches();
      return W.filterPanel({
        title: "Tamper Active Branches",
        count: tampered.length,
        subtitle: "Zones reporting an open tamper switch right now",
        rows: tampered,
        columns: [
          { label: "Branch", className: "name", render: function (r) { return r.branch.name; } },
          { label: "District", className: "sub", render: function (r) { return r.branch.district; } },
          { label: "Zone", className: "sub", render: function (r) { return r.zone; } },
          { label: "Since", className: "mono", render: function (r) { return r.time; } },
        ],
        onRowClick: function (r) { openBranch(ctx, r.branch); },
        onClose: function () { ctx.setState({ liveStatusFilter: null }); },
      });
    }

    var meta = LIVE_FILTERS[key];
    if (!meta) return null;
    var rows = App.data.allBranches().filter(meta.match);
    return W.filterPanel({
      title: meta.title,
      count: rows.length,
      subtitle: "Click a row to open that branch",
      rows: rows.slice(0, 120),
      columns: [
        { label: "Branch", key: "name", className: "name" },
        { label: "District", key: "district", className: "sub" },
        { label: "Panel Status", render: function (b) { return W.panelBadge(b.panelStatus); } },
        { label: "Connectivity", render: function (b) { return W.connBadge(b.connectivity); } },
      ],
      onRowClick: function (b) { openBranch(ctx, b); },
      onClose: function () { ctx.setState({ liveStatusFilter: null }); },
    });
  }

  /* Branches whose panel is currently in a condition an operator must act on. */
  function openIncidents() {
    var rows = App.data.allBranches()
      .filter(function (b) {
        return b.panelStatus === "Alarm Active" || b.panelStatus === "Fault";
      })
      .map(function (b) {
        var zoneEvent = (b.events || []).find(function (e) { return e.zone; });
        return {
          branch: b,
          name: b.name,
          district: b.district,
          panelStatus: b.panelStatus,
          zone: zoneEvent ? zoneEvent.zone : "--",
          since: zoneEvent ? zoneEvent.time : "--",
        };
      });

    App.data.tamperBranches().forEach(function (t) {
      rows.push({
        branch: t.branch,
        name: t.branch.name,
        district: t.branch.district,
        panelStatus: "Tamper Active",
        zone: t.zone,
        since: t.time,
      });
    });

    return rows.sort(function (a, b) { return a.since < b.since ? 1 : a.since > b.since ? -1 : 0; });
  }

  function render(ctx) {
    var stats = App.data.networkStats();
    var tamperActive = App.data.tamperBranches().length;

    var cardDefs = [
      { key: "armed", label: "Armed", value: stats.armed, color: COLORS.navy, iconHtml: App.ICONS.arm },
      { key: "disarmed", label: "Disarmed", value: stats.disarmed, color: COLORS.grey, iconHtml: App.ICONS.disarm },
      { key: "alarm", label: "Alarm Active", value: stats.alarm, color: COLORS.red, iconHtml: App.ICONS.bell },
      { key: "fault", label: "Fault Active", value: stats.fault, color: COLORS.amber, iconHtml: App.ICONS.fault },
      { key: "tamper", label: "Tamper Active", value: tamperActive, color: COLORS.orange, iconHtml: App.ICONS.tamper },
    ];

    var cards = cardDefs.map(function (d) {
      var selected = ctx.state.liveStatusFilter === d.key;
      return {
        compact: true,
        label: d.label,
        value: d.value,
        hint: "Click to verify",
        color: d.color,
        iconHtml: d.iconHtml,
        selected: selected,
        onClick: function () {
          ctx.setState({ liveStatusFilter: selected ? null : d.key });
        },
      };
    });

    var incidents = openIncidents();

    return h(
      "div",
      h("div.mb-lg", W.kpiRow(cards, 5)),
      livePanel(ctx),
      h(
        "div.card",
        { style: "overflow:hidden;" },
        h("div.card-head",
          h("div",
            h("div.card-title", "Branches Currently in Alarm / Fault / Tamper ",
              h("span.muted-count", "(" + incidents.length + ")")),
            h("div.card-sub", "Click a row to view the full branch detail"))),
        h("div.table-scroll", { style: "max-height:460px;" }, W.dataTable([
          { label: "Branch", key: "name", className: "name" },
          { label: "District", key: "district", className: "sub" },
          { label: "Status", render: function (r) { return W.panelBadge(r.panelStatus); } },
          { label: "Zone", key: "zone", className: "sub" },
          { label: "Since", key: "since", className: "mono" },
        ], incidents, {
          onRowClick: function (r) { openBranch(ctx, r.branch); },
        }))
      )
    );
  }

  App.views = App.views || {};
  App.views.intrusionStatus = {
    label: "Intrusion Status",
    icon: "intrusion",
    title: "Intrusion Status",
    subtitle: "Arm, alarm, fault and tamper state",
    render: render,
  };
})(window.App = window.App || {});

/* ==== src/views/zoneStatus.js ==== */
/* Zone Status: pick a branch, then read its 8-zone panel (plus the panel
   tamper circuit) in one of three presentations - grand cards, a dark
   showcase, or a dense table. */
(function (App) {
  "use strict";

  var h = App.dom.h;
  var badge = App.dom.badge;
  var iconChip = App.dom.iconChip;
  var W = App.widgets;
  var u = App.utils;
  var COLORS = u.COLORS;

  var VIEW_MODES = [
    { key: "grand", label: "Grand View" },
    { key: "showcase", label: "Showcase View" },
    { key: "table", label: "Table View" },
  ];

  var PICKER_MODES = [
    { key: "district", label: "By District" },
    { key: "grid", label: "All (Grid)" },
  ];

  /* The branch the view opens on: the first one actually in alarm, so the
     default screen shows a panel worth looking at. */
  function defaultBranch() {
    var all = App.data.allBranches();
    return all.find(function (b) { return b.panelStatus === "Alarm Active"; }) || all[0];
  }

  /* The ninth card beside the 8 zones: the panel's tamper circuit. It trips
     when any zone reports an open tamper switch, the same rule that feeds
     Tamper Active on Intrusion Status, so the two always agree. */
  function panelTamper(zones) {
    var tripped = zones.find(function (z) { return z.tamper === "Tamper"; });
    return {
      name: "Tamper",
      label: tripped ? "Tamper" : "Normal",
      color: tripped ? COLORS.orange : COLORS.green,
      detail: tripped ? tripped.name : "All 8 zones secure",
      lastTrigger: tripped ? tripped.lastTrigger : "--",
    };
  }

  function heroStats(zones) {
    var count = function (fn) { return zones.filter(fn).length; };
    var normal = count(function (z) { return z.dominantLabel === "Normal"; });
    return {

/* Reports: ten canned reports over the same event store, each exportable
   as CSV. Report definitions live in src/data/derived.js. */
(function (App) {
  "use strict";

  var h = App.dom.h;
  var badge = App.dom.badge;
  var iconChip = App.dom.iconChip;
  var W = App.widgets;
  var u = App.utils;
  var COLORS = u.COLORS;

  var ROW_LIMIT = 400;

  /* The most recent day present in the log; every range is measured from it. */
  function latestDate(events) {
    return events.reduce(function (acc, e) {
      var d = e.time.slice(0, 10);
      return d > acc ? d : acc;
    }, events.length ? events[0].time.slice(0, 10) : App.data.TODAY);
  }

  /* Calendar arithmetic in UTC: a local-midnight Date read back through
     toISOString() lands on the previous day east of Greenwich (e.g. IST). */
  function shiftDays(dateStr, delta) {
    var d = new Date(dateStr + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + delta);
    return d.toISOString().slice(0, 10);
  }

  function scopeEvents(def, all) {
    var latest = latestDate(all);
    var rows = all;
    if (def.range === "today") {
      rows = rows.filter(function (e) { return e.time.slice(0, 10) === latest; });
    } else if (def.range === "week") {
      var from = shiftDays(latest, -6);
      rows = rows.filter(function (e) { return e.time.slice(0, 10) >= from; });
    } else if (def.range === "month") {
      rows = rows.filter(function (e) { return e.time.slice(0, 7) === latest.slice(0, 7); });
    }
    if (def.types) {
      rows = rows.filter(function (e) { return def.types.indexOf(e.type) !== -1; });
    }
    return rows;
  }

  /* Per-branch event tallies for the branch-wise report. */
  function branchRollup(all) {
    var byBranch = {};
    all.forEach(function (e) {
      var c = byBranch[e.branchId] ||
        (byBranch[e.branchId] = { total: 0, alarm: 0, fault: 0, tamper: 0 });
      c.total++;
      if (e.type === "Alarm") c.alarm++;
      else if (e.type === "Fault") c.fault++;
      else if (e.type === "Tamper Activate") c.tamper++;
    });

    return App.data.allBranches().map(function (b) {
      var c = byBranch[b.id] || { total: 0, alarm: 0, fault: 0, tamper: 0 };
      return {
        name: b.name, district: b.district, status: b.status,
        total: c.total, alarm: c.alarm, fault: c.fault, tamper: c.tamper,
      };
    }).sort(function (a, b) { return b.total - a.total; });

      type: "text/csv;charset=utf-8;",

    a.href = url;
    a.download = filename;
    document.body.appendChild(a);

    var defs = App.data.REPORT_DEFS;
    var activeKey = ctx.state.reportType || defs[0].key;
    var def = defs.find(function (d) { return d.key === activeKey; }) || defs[0];
    var all = App.data.allEvents();
    var isBranchwise = def.scope === "branchwise";

    var branchRows = isBranchwise ? branchRollup(all) : [];
    var eventRows = isBranchwise ? [] : scopeEvents(def, all);

    var rail = h("div.report-rail", defs.map(function (d) {
      return h(
        "button.report-item" + (d.key === activeKey ? ".is-active" : ""),
        { type: "button", onclick: function () { ctx.setState({ reportType: d.key }); } },
        iconChip(App.ICONS[d.icon], d.color, { class: "sm" }),
        h("div", { style: "min-width:0;" },

      ? branchRows.map(function (r) {

  function overallPill(stats) {
    if (stats.alarm > 0) {
      return { label: "ALERT — ALARM ACTIVE", bg: "#fdeeee", color: COLORS.red, border: "#f3c9c9" };
    }
    if (stats.fault > 0) {
      return { label: "WARNING — FAULT PRESENT", bg: "#fdf3e4", color: COLORS.amber, border: "#f0dcb3" };
    }
    return { label: "SECURE — ALL NORMAL", bg: "#e9f6ee", color: COLORS.green, border: "#bfe3cc" };
  }

  function buildTopbar() {
    refs.title = h("h1");
    refs.subtitle = h("div.topbar-sub");
    refs.clock = h("span.clock-time", App.prefs.fmtClock(state.now));
    refs.pill = h("div.overall-pill");
    refs.freshness = h("span.freshness");
    refs.idleNote = h("span.idle-note", { role: "status" });
    refs.userChip = h("span", state.userEmail || "");

    var signOut = h(
      "div.user-chip",
      refs.userChip,
      h("button.sign-out-btn", { type: "button", onclick: signOut }, "Sign out")
    );

    return h(
      "header.topbar",
      h("div", refs.title, refs.subtitle),
      h("div.topbar-right",
        refs.idleNote,
        refs.freshness,
        h("div.clock", h("span.clock-dot"), refs.clock),
        refs.pill,
        signOut)
    );
  }

  /* ---- Render ---------------------------------------------------------- */

  /* Repainting the content region blows away focus, so remember which input
     the operator was typing in and restore it plus the caret afterwards. */
  function captureFocus() {
    var el = document.activeElement;
    if (!el || !el.id || (el.tagName !== "INPUT" && el.tagName !== "TEXTAREA")) return null;
    return {
      id: el.id,
      start: el.selectionStart,
      end: el.selectionEnd,
    };
  }

  function restoreFocus(snapshot) {
    if (!snapshot) return;
    var el = document.getElementById(snapshot.id);
    if (!el) return;
    el.focus();
    if (el.setSelectionRange && snapshot.start !== null && el.type !== "range") {
      try { el.setSelectionRange(snapshot.start, snapshot.end); } catch (err) { /* type has no selection */ }
    }
  }

  function render() {
    var view = App.views[state.active] || App.views.overview;
    var stats = App.data.networkStats();
    var pill = overallPill(stats);
    var focus = captureFocus();

    refs.title.textContent = view.title;
    refs.subtitle.textContent = view.subtitle;
    refs.clock.textContent = App.prefs.fmtClock(state.now);
    refs.pill.textContent = pill.label;
    refs.pill.setAttribute(
      "style",
      "background:" + pill.bg + ";color:" + pill.color + ";border-color:" + pill.border + ";"
    );

    refs.freshness.classList.toggle("is-stale", !!state.refreshError);
    App.dom.clear(refs.freshness);
    if (state.lastUpdated) {
      refs.freshness.appendChild(document.createTextNode(state.refreshError
        ? "Live feed delayed — showing data from " : "Updated "));
      refs.freshness.appendChild(App.dom.val(App.prefs.fmtClock(state.lastUpdated)));
    }

    if (refs.userChip) refs.userChip.textContent = state.userEmail || "";

    Object.keys(refs.navButtons).forEach(function (key) {
      var isActive = key === state.active;
      refs.navButtons[key].classList.toggle("is-active", isActive);
      refs.navButtons[key].lastChild.style.visibility = isActive ? "visible" : "hidden";
    });

    App.dom.clear(refs.content);
    refs.content.appendChild(view.render(ctx));
    restoreFocus(focus);
  }

  /* ---- Boot ------------------------------------------------------------ */

  var chromeInitialized = false;

  function boot() {
    var root = document.getElementById("app");
    App.dom.clear(root);
    refs.content = h("main.content");

    var main = h("div.main", buildTopbar(), refs.content);
    root.appendChild(h("div.shell", buildSidebar(), main));

    var hash = window.location.hash.slice(1);
    if (App.views[hash]) state.active = hash;

    /* One-time setup only -- boot() can now run more than once per page
       load (e.g. after a session expires and the operator signs back in),
       and re-registering these each time would stack up duplicate timers
       and listeners. */
    if (!chromeInitialized) {
      chromeInitialized = true;

      window.addEventListener("hashchange", function () {
        var key = window.location.hash.slice(1);
        if (App.views[key] && key !== state.active) {
          state.active = key;
          render();
        }
      });

      /* The header clock is the only thing that ticks; repainting the whole
         content region every second would fight with scrolling and typing. */
      setInterval(function () {
        state.now = new Date();
        refs.clock.textContent = App.prefs.fmtClock(state.now);
        checkIdle();
      }, 1000);

      ["pointerdown", "pointermove", "keydown", "wheel", "touchstart"].forEach(function (type) {
        document.addEventListener(type, noteActivity, { passive: true, capture: true });
      });
    }

    noteActivity();

    render();

    /* No-op wherever src/data/liveSource.js isn't loaded (e.g. selftest.html,
       which deliberately runs on generated sample data only). */
    if (App.data.startPolling) App.data.startPolling();
  }

  function renderBootState(title, detail, isError, onRetry) {
    var root = document.getElementById("app");
    App.dom.clear(root);
    var card = h(
      "div.boot-card",
      isError ? null : h("div.boot-spinner"),
      h("div.boot-title" + (isError ? ".is-error" : ""), title),
      h("div.boot-detail", detail)
    );
    if (isError) {
      card.appendChild(
        h("button.boot-retry", { type: "button", onclick: onRetry }, "Retry")
      );
    }
    root.appendChild(h("div.boot-state", card));
  }

  /* Fetches branch data and boots the dashboard shell, or shows a blocking
     retry screen on failure -- shared by the initial page load and by a
     fresh login after a session expired. A 401 mid-fetch (session expired
     between checking /me and this actually running) falls back to the
     login screen rather than the generic retry screen. */
  function loadThenBoot() {
    renderBootState(
      "Loading branch data",
      "Fetching the live feed from the branch data service…",
      false
    );

    App.data.load().then(function () {
      state.lastUpdated = new Date();
      boot();
    }, function (err) {
      if (err && err.isAuthError) {
        renderLoginScreen("Your session expired — sign in again.");
        return;
      }
      renderBootState(
        "Could not reach the branch data service",
        (err && err.message ? err.message : "Request failed") +
          ". Confirm the backend is running (see backend/README.md), then retry.",
        true,
        loadThenBoot
      );
    });
  }

  /* ---- Auth ------------------------------------------------------------- */

  function renderLoginScreen(message) {
    if (App.data.stopPolling) App.data.stopPolling();

    var root = document.getElementById("app");
    App.dom.clear(root);

    var usernameInput = h("input.text-input", {
      type: "text", id: "login-username", placeholder: "Email", autocomplete: "username",
    });
    var passwordInput = h("input.text-input", {
      type: "password", id: "login-password", placeholder: "Password", autocomplete: "current-password",
    });
    var errorBox = h("div.login-error", message || "");

    function submit() {
      var username = usernameInput.value.trim();
      var password = passwordInput.value;
      if (!username || !password) {
        errorBox.textContent = "Enter your email and password.";
        return;
      }
      errorBox.textContent = "Signing in…";
      App.auth.login(username, password).then(function (res) {
        if (res.status === "new_password_required") {
          renderNewPasswordScreen(username, res.session);
          return;
        }
        if (res.status === "mfa_required") {
          renderMfaScreen(username, res.mfa_type, res.session);
          return;
        }
        state.userEmail = res.email;
        loadThenBoot();
      }, function (err) {
        renderLoginScreen((err && err.message) || "Sign-in failed.");
      });
    }

    var onEnter = function (e) { if (e.key === "Enter") submit(); };
    usernameInput.onkeydown = onEnter;
    passwordInput.onkeydown = onEnter;

    var card = h(
      "div.boot-card.login-card",
      h("div.boot-title", "TN Grama Bank — Sign in"),
      h("div.login-field", h("label", { for: "login-username" }, "Email"), usernameInput),
      h("div.login-field", h("label", { for: "login-password" }, "Password"), passwordInput),
      errorBox,
      h("button.boot-retry", { type: "button", onclick: submit }, "Sign in"),
      h("button.forgot-password-link", { type: "button", onclick: function () { renderForgotPasswordScreen(); } }, "Forgot password?")
    );
    root.appendChild(h("div.boot-state", card));
    usernameInput.focus();
  }

  /* Admin-created accounts get a temporary password and must set a real one
     on first login -- Cognito's NEW_PASSWORD_REQUIRED challenge, surfaced by
     /api/auth/login as {status:"new_password_required", session}. */
  function renderNewPasswordScreen(username, cognitoSession, message) {
    var root = document.getElementById("app");
    App.dom.clear(root);

    var newPasswordInput = h("input.text-input", {
      type: "password", id: "new-password", placeholder: "New password", autocomplete: "new-password",
    });
    var confirmInput = h("input.text-input", {
      type: "password", id: "confirm-password", placeholder: "Confirm new password", autocomplete: "new-password",
    });
    var errorBox = h("div.login-error", message || "");

    function submit() {
      var newPassword = newPasswordInput.value;
      if (!newPassword || newPassword !== confirmInput.value) {
        errorBox.textContent = "Passwords must match and cannot be empty.";
        return;
      }
      errorBox.textContent = "Setting your password…";
      App.auth.completeNewPassword(username, newPassword, cognitoSession).then(function (res) {
        state.userEmail = res.email;
        loadThenBoot();
      }, function (err) {
        renderNewPasswordScreen(username, cognitoSession, (err && err.message) || "Could not set your password.");
      });
    }

    var onEnter = function (e) { if (e.key === "Enter") submit(); };
    newPasswordInput.onkeydown = onEnter;
    confirmInput.onkeydown = onEnter;

    var card = h(
      "div.boot-card.login-card",
      h("div.boot-title", "Set a new password"),
      h("div.boot-detail", "First sign-in for " + username + " — choose a password only you know."),
      h("div.login-field", h("label", { for: "new-password" }, "New password"), newPasswordInput),
      h("div.login-field", h("label", { for: "confirm-password" }, "Confirm new password"), confirmInput),
      errorBox,
      h("button.boot-retry", { type: "button", onclick: submit }, "Set password and sign in")
    );
    root.appendChild(h("div.boot-state", card));
    newPasswordInput.focus();
  }

  /* Cognito's SMS_MFA / SOFTWARE_TOKEN_MFA challenge -- only appears for
     accounts that have MFA enrolled (the pool is MfaConfiguration=OPTIONAL,
     not required), so a non-MFA account's login is completely unaffected. */
  function renderMfaScreen(username, mfaType, cognitoSession, message) {
    var root = document.getElementById("app");
    App.dom.clear(root);

    var codeInput = h("input.text-input", {
      type: "text", id: "mfa-code", placeholder: "6-digit code", autocomplete: "one-time-code",
    });
    var errorBox = h("div.login-error", message || "");

    function submit() {
      var code = codeInput.value.trim();
      if (!code) {
        errorBox.textContent = "Enter the code from your authenticator.";
        return;
      }
      errorBox.textContent = "Verifying…";
      App.auth.completeMfa(username, mfaType, code, cognitoSession).then(function (res) {
        state.userEmail = res.email;
        loadThenBoot();
      }, function (err) {
        renderMfaScreen(username, mfaType, cognitoSession, (err && err.message) || "Invalid code.");
      });
    }

    codeInput.onkeydown = function (e) { if (e.key === "Enter") submit(); };

    var card = h(
      "div.boot-card.login-card",
      h("div.boot-title", "Verification code"),
      h("div.boot-detail", "Enter the verification code for " + username + "."),
      h("div.login-field", h("label", { for: "mfa-code" }, "Code"), codeInput),
      errorBox,
      h("button.boot-retry", { type: "button", onclick: submit }, "Verify")
    );
    root.appendChild(h("div.boot-state", card));
    codeInput.focus();
  }

  /* Cognito's self-service reset: step 1 (this screen) emails a code and
     always shows the same message whether or not the account exists (the
     backend guarantees that -- this screen never learns which). Step 2 is
     renderResetPasswordScreen. */
  function renderForgotPasswordScreen() {
    var root = document.getElementById("app");
    App.dom.clear(root);

    var usernameInput = h("input.text-input", {
      type: "text", id: "forgot-username", placeholder: "Email", autocomplete: "username",
    });
    var errorBox = h("div.login-error", "");

    function submit() {
      var username = usernameInput.value.trim();
      if (!username) {
        errorBox.textContent = "Enter your email.";
        return;
      }
      errorBox.textContent = "Sending…";
      var fallbackDetail = "If that account exists, a reset code has been sent to its email.";
      App.auth.forgotPassword(username).then(function (res) {
        renderResetPasswordScreen(username, res.detail || fallbackDetail);
      }, function () {
        renderResetPasswordScreen(username, fallbackDetail);
      });
    }

    usernameInput.onkeydown = function (e) { if (e.key === "Enter") submit(); };

    var card = h(
      "div.boot-card.login-card",
      h("div.boot-title", "Reset your password"),
      h("div.login-field", h("label", { for: "forgot-username" }, "Email"), usernameInput),
      errorBox,
      h("button.boot-retry", { type: "button", onclick: submit }, "Send reset code"),
      h("button.forgot-password-link", { type: "button", onclick: function () { renderLoginScreen(); } }, "Back to sign in")
    );
    root.appendChild(h("div.boot-state", card));
    usernameInput.focus();
  }

  function renderResetPasswordScreen(username, detail, error) {
    var root = document.getElementById("app");
    App.dom.clear(root);

    var codeInput = h("input.text-input", {
      type: "text", id: "reset-code", placeholder: "Reset code", autocomplete: "one-time-code",
    });
    var newPasswordInput = h("input.text-input", {
      type: "password", id: "reset-new-password", placeholder: "New password", autocomplete: "new-password",
    });
    var confirmInput = h("input.text-input", {
      type: "password", id: "reset-confirm-password", placeholder: "Confirm new password", autocomplete: "new-password",
    });
    var errorBox = h("div.login-error", error || "");

    function submit() {
      var code = codeInput.value.trim();
      var newPassword = newPasswordInput.value;
      if (!code || !newPassword || newPassword !== confirmInput.value) {
        errorBox.textContent = "Enter the code and matching new passwords.";
        return;
      }
      errorBox.textContent = "Resetting…";
      App.auth.confirmForgotPassword(username, code, newPassword).then(function () {
        renderLoginScreen("Password reset — sign in with your new password.");
      }, function (err) {
        renderResetPasswordScreen(username, detail, (err && err.message) || "Could not reset your password.");
      });
    }

    var onEnter = function (e) { if (e.key === "Enter") submit(); };
    codeInput.onkeydown = onEnter;
    newPasswordInput.onkeydown = onEnter;
    confirmInput.onkeydown = onEnter;

    var card = h(
      "div.boot-card.login-card",
      h("div.boot-title", "Enter reset code"),
      h("div.boot-detail", detail || ""),
      h("div.login-field", h("label", { for: "reset-code" }, "Reset code"), codeInput),
      h("div.login-field", h("label", { for: "reset-new-password" }, "New password"), newPasswordInput),
      h("div.login-field", h("label", { for: "reset-confirm-password" }, "Confirm new password"), confirmInput),
      errorBox,
      h("button.boot-retry", { type: "button", onclick: submit }, "Reset password")
    );
    root.appendChild(h("div.boot-state", card));
    codeInput.focus();
  }

  function signOut() {
    App.auth.logout().then(afterSignOut, afterSignOut);
  }

  function afterSignOut(message) {
    state.userEmail = null;
    state.lastUpdated = null;
    state.refreshError = null;
    renderLoginScreen(typeof message === "string" ? message : "");
  }

  /* ---- Inactivity sign-out --------------------------------------------- */

  /* Signs the operator out after the idle time chosen under System Setting >
     General, warning in the header for the last minute. Only runs while
     signed in -- the offline copy (no App.auth) has no session to end. The
     server's own session lifetime still applies on top of this. */
  var IDLE_WARNING_MS = 60 * 1000;
  var lastActivity = Date.now();

  function noteActivity() {
    lastActivity = Date.now();
  }

  function checkIdle() {
    if (!App.auth || !state.userEmail) {
      refs.idleNote.textContent = "";
      return;
    }
    var limit = App.prefs.get("idleTimeoutMin") * 60 * 1000;
    var remaining = limit - (Date.now() - lastActivity);
    if (remaining <= 0) {
      refs.idleNote.textContent = "";
      var minutes = App.prefs.get("idleTimeoutMin");
      var message = "Signed out after " + minutes + " minutes without activity — sign in again.";
      state.userEmail = null; // stops further checks while logout is in flight
      if (App.data.stopPolling) App.data.stopPolling();
      App.auth.logout().then(function () { afterSignOut(message); }, function () { afterSignOut(message); });
      return;
    }
    refs.idleNote.textContent = remaining <= IDLE_WARNING_MS
      ? "Signing out in " + Math.ceil(remaining / 1000) + "s — move the mouse or press a key to stay"
      : "";
  }

  /* Called by src/data/liveSource.js when a background poll gets a 401 --
     the session timed out mid-use. Distinct from a network hiccup
     (reportRefresh's low-key "feed delayed" indicator): this needs the
     operator to sign in again, not just a retry. */
  function onSessionExpired() {
    state.userEmail = null;
    renderLoginScreen("Your session expired — sign in again.");
  }

  /* If src/data/liveSource.js is loaded (see index.html), a session check
     runs before anything renders: a valid session loads branch data and
     boots straight in (silent resume); no session shows the login screen.
     Without liveSource.js/authSource.js (as in tests/selftest.html) the
     dashboard boots straight into the generated sample data, exactly as
     before -- unauthenticated dashboard views are never part of that path. */
  function start() {
    /* Opened straight from disk (index.html or the emailed standalone build)
       there is no API to sign in against, so run on the bundled sample data. */
    if (!App.data.load || !App.auth || window.location.protocol === "file:") {
      boot();
      return;
    }

    App.auth.me().then(function (res) {
      state.userEmail = res.email;
      loadThenBoot();
    }, function () {
      renderLoginScreen();
    });
  }

  App.start = start;
  App.reportRefresh = reportRefresh;
  App.onSessionExpired = onSessionExpired;
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})(window.App = window.App || {});

</script>
</body>
</html>
